# Fictional demo profile for tests and documentation.
format = "tilelens-profile"
version = 1
name = "Demo Garden"

[board]
width = 13
height = 13
layout = [
  "W...l...l...W",
  ".w...L.L...w.",
  "..w..l.l..w..",
  "...w.....w...",
  "l...L...L...l",
  ".L..l...l..L.",
  "...l..*..l...",
  ".L..l...l..L.",
  "l...L...L...l",
  "...w.....w...",
  "..w..l.l..w..",
  ".w...L.L...w.",
  "W...l...l...W",
]

[board.legend]
l = "double_letter"
L = "triple_letter"
w = "double_word"
W = "triple_word"
"*" = { name = "start", word = 2 }

[rules]
start_squares = [[6, 6]]
min_word_length = 2
word_premium_stacking = "multiply"

[rack]
size = 7
blanks = 2

[scoring]
full_rack_bonus = 40
full_rack_tiles = 7

