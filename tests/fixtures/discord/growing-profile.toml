# A profile for a 27x19 board that grows, measured from a real game on screen. Test fixture only.
format = "tilelens-profile"
version = 1
name = "Growing 27x19"

[board]
width = 27
height = 19
expand = 12
period = [12, 12]
layout = [
  "...d..d.d..d...d..d.d..d...",
  ".d...D...D...d...D...D...d.",
  "....d.t.t.d.....d.t.t.d....",
  "dDd....T....dDd....T....dDd",
  "....d.t.t.d.....d.t.t.d....",
  ".d...D...D...d...D...D...d.",
  "...d..d.d..d...d..d.d..d...",
  "....D.....D.....D.....D....",
  "t.t....d....t.t....d....t.t",
  "...D...D...D.*.D...D...D...",
  "t.t....d....t.t....d....t.t",
  "....D.....D.....D.....D....",
  "...d..d.d..d...d..d.d..d...",
  ".d...D...D...d...D...D...d.",
  "....d.t.t.d.....d.t.t.d....",
  "dDd....T....dDd....T....dDd",
  "....d.t.t.d.....d.t.t.d....",
  ".d...D...D...d...D...D...d.",
  "...d..d.d..d...d..d.d..d...",
]

[board.legend]
d = "double_letter"
t = "triple_letter"
D = "double_word"
T = "triple_word"
"*" = { name = "start" }

[rules]
start_squares = [[9, 13]]
word_premium_stacking = "multiply"

